<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>異常対応・部品在庫</title>
<meta name="theme-color" content="#0A1218">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="異常対応">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
html,body{margin:0;height:100%;background:#0A1218;color:#E7F2F6;font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}
#f{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0A1218}
#ld{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;transition:opacity .3s}
#ld.off{opacity:0;pointer-events:none}
.ring{width:54px;height:54px;border-radius:50%;border:3px solid #1D2F3D;border-top-color:#22D3C5;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
#help{display:none;font-size:14px;color:#8FA6B4;line-height:1.7}
#help a{color:#22D3C5}
</style>
</head>
<body>
<iframe id="f" title="異常対応・部品在庫" allow="camera; clipboard-write; fullscreen" referrerpolicy="no-referrer"></iframe>
<div id="ld"><div class="ring"></div><div id="msg">読み込み中…</div>
<div id="help">うまく表示されないときは、<a id="direct" href="#">こちらから直接開く</a>ことができます。</div></div>
<script>
// ▼ アプリ(Google Apps Script)のURL。作り直したときは、ここだけ書き換えます
const APP_URL = 'https://script.google.com/macros/s/AKfycbw487eg4Ep1PYxIXKuiZvOqrLfGwfOG8I7LNRywjmsSLvM-H2sIcaghuS2vJhwzWCNzlg/exec';
const f = document.getElementById('f'), ld = document.getElementById('ld');
document.getElementById('direct').href = APP_URL;
f.onload = () => { ld.classList.add('off'); };
f.src = APP_URL;
setTimeout(() => { document.getElementById('help').style.display = 'block'; }, 9000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
